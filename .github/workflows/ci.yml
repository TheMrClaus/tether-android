# Parity-program CI (PLAN §6.4, task T0.4): build + lint + unit tests on every push/PR.
# Roborazzi screenshot verification and the conformance corpora switch on automatically once the
# tasks that add them land (T3.4: Roborazzi plugin; T1.1/T2.1: Wire/ReducerConformanceTest live in
# :core:protocol / :core:reducer and run as ordinary unit tests). The release workflow is separate
# (android-release.yml, manual) and unchanged.
name: CI

# Manual only (owner 2026-10-10). The merge bar is the local full gate (~/ta-runs/gate.sh runs these same steps plus
# :app:assembleRelease on the exact head before every fast-forward), and android-release.yml builds releases on its own.
# On GitHub's small runners this job failed on every push for reasons outside the code: Robolectric's runtime-jar download
# from Maven failing (whole test classes fail at MavenArtifactFetcher) and timing-sensitive tests on slow cores.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The action's default package list still includes the retired `tools` package, which makes
      # sdkmanager exit 1 — ask for platform-tools only (AGP fetches the platform it needs).
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v6

      # Android modules run testDebugUnitTest; the pure-JVM core modules (T0.3) only have `test`.
      # verifyDesignTokens (T3.1, PLAN D9) fails when GeneratedTokens.kt drifts from the token JSON.
      - name: Assemble, lint, unit tests
        run: >
          ./gradlew assembleDebug lint testDebugUnitTest
          :core:protocol:test :core:reducer:test verifyDesignTokens
          --stacktrace --console=plain

      - name: Roborazzi verify (exact-match goldens)
        run: ./gradlew verifyRoborazziDebug --console=plain

      # T3.4: the debug-only Component Gallery must never reach a release build.
      - name: Gallery absent from release
        run: ./gradlew :app:verifyGalleryNotInRelease --console=plain

      - name: Corpus pin check (once parity-corpus/ is vendored)
        run: |
          if [ -f parity-corpus/corpus-manifest.json ]; then
            python3 -c "import json;m=json.load(open('parity-corpus/corpus-manifest.json'));print('corpus', m.get('tetherSha'), 'v', m.get('protocolVersion'))"
          else
            echo "No vendored corpus yet (T1.1/T2.1) — skipping."
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
